<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maheen AI</title>

<style>
    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        margin: 0;
        background: linear-gradient(135deg, #f8d9ff, #dce7ff);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .chat {
        width: 380px;
        max-width: 95%;
        height: 600px;
        background: white;
        border-radius: 25px;
        overflow: hidden;
        box-shadow: 0 15px 40px rgba(0,0,0,.18);
        display: flex;
        flex-direction: column;
    }

    .header {
        background: linear-gradient(135deg, #8e44ad, #5b6ee1);
        color: white;
        padding: 20px;
        text-align: center;
    }

    .header h2 {
        margin: 0 0 5px;
    }

    .header p {
        margin: 0;
        font-size: 13px;
        opacity: .9;
    }

    #messages {
        flex: 1;
        padding: 15px;
        overflow-y: auto;
    }

    .message {
        max-width: 80%;
        padding: 11px 14px;
        margin: 9px 0;
        border-radius: 17px;
        line-height: 1.4;
        font-size: 14px;
    }

    .bot {
        background: #f0e7ff;
        color: #333;
        border-bottom-left-radius: 5px;
    }

    .user {
        background: #6757d9;
        color: white;
        margin-left: auto;
        border-bottom-right-radius: 5px;
    }

    .input-area {
        display: flex;
        padding: 12px;
        border-top: 1px solid #eee;
        gap: 8px;
    }

    input {
        flex: 1;
        padding: 13px;
        border: 1px solid #ddd;
        border-radius: 20px;
        outline: none;
    }

    button {
        border: none;
        background: #6757d9;
        color: white;
        padding: 0 18px;
        border-radius: 20px;
        cursor: pointer;
    }

    button:hover {
        background: #5142c4;
    }
</style>
</head>

<body>

<div class="chat">

    <div class="header">
        <h2>✨ Maheen AI</h2>
        <p>Your friendly AI assistant</p>
    </div>

    <div id="messages">
        <div class="message bot">
            Hi! 👋 Main Maheen AI hoon. 
            Main friendly, helpful aur positive rehne ki koshish karti hoon. 
            Batao, aaj kis cheez mein help chahiye? 💜
        </div>
    </div>

    <div class="input-area">
        <input id="userInput" type="text"
               placeholder="Maheen se baat karo..."
               onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>

</div>

<script>
function sendMessage() {

    const input = document.getElementById("userInput");
    const text = input.value.trim();

    if (!text) return;

    addMessage(text, "user");
    input.value = "";

    setTimeout(() => {
        const reply = maheenPersonality(text);
        addMessage(reply, "bot");
    }, 600);
}

function addMessage(text, type) {

    const messages = document.getElementById("messages");

    const div = document.createElement("div");
    div.className = "message " + type;
    div.textContent = text;

    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}

function maheenPersonality(message) {

    const text = message.toLowerCase();

    // Greetings
    if (
        text.includes("hi") ||
        text.includes("hello") ||
        text.includes("salam") ||
        text.includes("assalam")
    ) {
        return "Walaikum Assalam! 🌸 Main Maheen hoon. Aap se baat karke khushi hui! Batao kya scene hai? 😊";
    }

    // Name
    if (text.includes("your name") || text.includes("naam")) {
        return "Mera naam Maheen AI hai ✨ Mujhe friendly aur helpful assistant ke taur par design kiya gaya hai.";
    }

    // Help
    if (
        text.includes("help") ||
        text.includes("madad")
    ) {
        return "Bilkul! 💜 Main tumhari help karne ke liye ready hoon. Apna task batao.";
