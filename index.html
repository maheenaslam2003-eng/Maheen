<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maheen AI</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #f8d9ff, #dce7ff);
}

.chat {
    width: 420px;
    height: 650px;
    max-width: 95%;
    background: white;
    border-radius: 25px;
    overflow: hidden;
    box-shadow: 0 15px 40px rgba(0,0,0,0.18);
    display: flex;
    flex-direction: column;
}

.header {
    background: linear-gradient(135deg, #8e44ad, #5b6ee1);
    color: white;
    padding: 20px;
    text-align: center;
}

.header h2 {
    margin: 0 0 5px;
}

.header p {
    margin: 0;
    font-size: 13px;
}

#messages {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
}

.message {
    max-width: 82%;
    padding: 11px 14px;
    margin: 9px 0;
    border-radius: 17px;
    line-height: 1.5;
    font-size: 14px;
    white-space: pre-wrap;
}

.bot {
    background: #f0e7ff;
    color: #333;
    border-bottom-left-radius: 5px;
}

.user {
    background: #6757d9;
    color: white;
    margin-left: auto;
    border-bottom-right-radius: 5px;
}

.input-area {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid #eee;
}

input {
    flex: 1;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 20px;
    outline: none;
}

button {
    border: none;
    background: #6757d9;
    color: white;
    padding: 0 18px;
    border-radius: 20px;
    cursor: pointer;
}

button:hover {
    background: #5142c4;
}
</style>
</head>

<body>

<div class="chat">

    <div class="header">
        <h2>✨ Maheen AI</h2>
        <p>Your friendly AI assistant</p>
    </div>

    <div id="messages">
        <div class="message bot">
Hi! 👋 Main Maheen AI hoon.

Batao, aaj kis cheez mein help chahiye? 💜
        </div>
    </div>

    <div class="input-area">
        <input
            id="userInput"
            type="text"
            placeholder="Maheen se baat karo..."
        >

        <button id="sendButton">Send</button>
    </div>

</div>

<script>

const input = document.getElementById("userInput");
const sendButton = document.getElementById("sendButton");
const messages = document.getElementById("messages");


function addMessage(text, type) {

    const message = document.createElement("div");

    message.className = "message " + type;

    message.textContent = text;

    messages.appendChild(message);

    messages.scrollTop = messages.scrollHeight;
}


function sendMessage() {

    const text = input.value.trim();

    if (text === "") {
        return;
    }

    addMessage(text, "user");

    input.value = "";

    setTimeout(function() {

        const reply = getReply(text);

        addMessage(reply, "bot");

    }, 500);
}


function getReply(message) {

    const text = message.toLowerCase();


    if (
        text.includes("hi") ||
        text.includes("hello") ||
        text.includes("hey")
    ) {
        return "Hello! 🌸 Main Maheen AI hoon. Tum mujhse kuch bhi pooch sakti ho.";
    }


    if (
        text.includes("salam") ||
        text.includes("assalam")
    ) {
        return "Walaikum Assalam! 🌸 Kaise ho? Batao main tumhari kya help kar sakti hoon.";
    }


    if (
        text.includes("your name") ||
        text.includes("naam")
    ) {
        return "Mera naam Maheen AI hai ✨";
    }


    if (
        text.includes("how are you") ||
        text.includes("kaisi ho") ||
        text.includes("kesi ho")
    ) {
        return "Main bilkul theek hoon 😊 Tum batao, kaisi ho?";
    }


    if (
        text.includes("help") ||
        text.includes("madad")
    ) {
        return "Bilkul! 💜 Apna question ya task mujhe batao.";
    }


    if (
        text.includes("thank") ||
        text.includes("thanks") ||
        text.includes("shukriya")
    ) {
        return "You're most welcome! 💜";
    }


    if (text.includes("bye")) {
        return "Allah Hafiz! 🌸 Phir baat karte hain.";
    }


    return "Interesting! 🤔 Mujhe thora aur detail mein batao, main tumhari help karne ki koshish karti hoon. 💜";
}


sendButton.addEventListener("click", sendMessage);


input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

        sendMessage();

    }

});

</script>

</body>
</html>
