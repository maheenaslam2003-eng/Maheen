<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maheen AI</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial;background:#fff;color:#202123}.app{height:100%;display:flex;flex-direction:column}.top{height:60px;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 16px;gap:12px}.logo{width:36px;height:36px;border-radius:10px;background:#10a37f;color:white;display:grid;place-items:center;font-weight:bold}.title{font-weight:bold}.status{font-size:12px;color:#777}.menu{margin-left:auto;border:0;background:none;font-size:22px}.chat{flex:1;overflow:auto}.welcome{text-align:center;padding:50px 20px 20px}.welcome h1{font-size:30px}.welcome p{color:#777}.quick{max-width:800px;margin:auto;padding:10px 20px 20px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.quick button{background:#fff;border:1px solid #ddd;border-radius:14px;padding:14px;text-align:left}.quick span{display:block;font-size:20px;margin-bottom:6px}.messages{max-width:800px;margin:auto;padding:10px 20px 140px;width:100%}.row{display:flex;gap:10px;margin:18px 0}.row.user{justify-content:flex-end}.bubble{max-width:80%;padding:12px 16px;border-radius:18px;line-height:1.5;white-space:pre-wrap}.bot .bubble{background:#f5f5f5}.user .bubble{background:#e9e9e9}.mini{width:30px;height:30px;border-radius:9px;background:#10a37f;color:#fff;display:grid;place-items:center}.composerWrap{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:15px}.composer{max-width:800px;margin:auto;border:1px solid #ccc;border-radius:18px;display:flex;padding:7px}.composer textarea{flex:1;border:0;outline:0;resize:none;padding:10px;font:inherit}.send,.mic{width:42px;height:42px;border:0;border-radius:12px}.send{background:#10a37f;color:#fff}.mic{background:#f1f1f1}.note{text-align:center;color:#888;font-size:11px;margin-top:5px}@media(max-width:600px){.quick{grid-template-columns:1fr 1fr}}
</style></head><body><div class="app"><header class="top"><div class="logo">M</div><div><div class="title">Maheen AI</div><div class="status">● Online</div></div><button class="menu" id="clear">⋯</button></header><main class="chat" id="chat"><section class="welcome"><h1>How can I help you today?</h1><p>I'm Maheen — your friendly AI assistant ✨</p></section><section class="quick"><button data-c="YouTube kholo"><span>▶️</span>YouTube</button><button data-c="Google kholo"><span>🔎</span>Google</button><button data-c="Time batao"><span>🕐</span>Time</button><button data-c="Mujhe motivate karo"><span>✨</span>Motivate me</button></section><section class="messages" id="messages"></section></main><div class="composerWrap"><form class="composer" id="form"><textarea id="input" rows="1" placeholder="Message Maheen..."></textarea><button type="button" class="mic" id="mic">🎤</button><button type="submit" class="send">➤</button></form><div class="note">Maheen AI • Demo assistant</div></div></div><script>
(function(){var chat=document.getElementById("chat"),messages=document.getElementById("messages"),input=document.getElementById("input");
function add(t,w){var r=document.createElement("div");r.className="row "+w;if(w==="bot"){var i=document.createElement("div");i.className="mini";i.textContent="M";r.appendChild(i)}var b=document.createElement("div");b.className="bubble";b.textContent=t;r.appendChild(b);messages.appendChild(r);chat.scrollTop=chat.scrollHeight}
function reply(t){var x=t.toLowerCase();if(x.indexOf("youtube")>=0){add("Sure! YouTube open kar rahi hoon 🎬","bot");setTimeout(function(){location.href="https://www.youtube.com/"},500);return}if(x.indexOf("google")>=0){add("Okay! Google open kar rahi hoon 🔎","bot");setTimeout(function(){location.href="https://www.google.com/"},500);return}if(x.indexOf("time")>=0){add("Abhi "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})+" hai ⏰","bot");return}if(x.indexOf("motivat")>=0){add("Tum kar sakte ho 💜 Ek step at a time. Bas start karo!","bot");return}if(x.indexOf("salam")>=0||x.indexOf("hello")>=0||x.indexOf("hi")===0||x.indexOf("hey")===0){add("Walaikum Assalam! 🌸 Main Maheen hoon. Batao kya karna hai?","bot");return}if(x.indexOf("tum kon")>=0||x.indexOf("who are you")>=0){add("Main Maheen AI hoon ✨ Tumhari friendly assistant.","bot");return}add("Hmm 😄 Main samajh gayi. Abhi main demo mode mein hoon, lekin main tumhari baat sun rahi hoon!","bot")}
function send(){var t=input.value.trim();if(!t)return;add(t,"user");input.value="";input.style.height="auto";setTimeout(function(){reply(t)},300)}
document.getElementById("form").addEventListener("submit",function(e){e.preventDefault();send()});input.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});input.addEventListener("input",function(){this.style.height="auto";this.style.height=Math.min(this.scrollHeight,130)+"px"});
document.querySelectorAll(".quick button").forEach(function(b){b.addEventListener("click",function(){input.value=b.getAttribute("data-c");send()})});document.getElementById("clear").addEventListener("click",function(){messages.innerHTML="";add("Chat clear ho gayi 🌸 Phir se start karte hain!","bot")});
document.getElementById("mic").addEventListener("click",function(){var R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){add("🎤 Voice recognition is not supported in this browser.","bot");return}var r=new R();r.lang="en-US";r.onresult=function(e){input.value=e.results[0][0].transcript;send()};r.start()});add("Assalamualaikum! 🌸 Main Maheen hoon. Mujhse baat karo!","bot")})();
</script></body></html>
